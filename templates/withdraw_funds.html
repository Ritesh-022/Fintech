{% extends "base.html" %}

{% block title %}Withdraw Funds - FinTech Intelligence{% endblock %}

{% block content %}
<div class="container" style="padding: 3rem 0; max-width: 600px;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">💸</div>
        <h1 style="font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem;">Withdraw Funds</h1>
        <p style="color: var(--text-secondary);">Transfer money from your wallet</p>
    </div>

    <div class="card" style="padding: 2rem;">
        <form method="POST" action="{{ url_for('withdraw_funds') }}" id="withdrawForm">
            <div class="form-group">
                <label class="form-label">Withdrawal Amount</label>
                <input type="number" 
                       name="amount" 
                       class="form-control" 
                       placeholder="Enter amount to withdraw"
                       step="0.01"
                       min="1"
                       required
                       style="font-size: 1.5rem; font-family: var(--font-mono);">
            </div>

            <div class="form-group">
                <label class="form-label">Destination</label>
                <select class="form-control" required>
                    <option value="">Select destination</option>
                    <option value="bank">Bank Account</option>
                    <option value="upi">UPI</option>
                    <option value="wallet">External Wallet</option>
                </select>
            </div>

            <div class="alert alert-warning">
                ⚠️ Withdrawals may take 1-3 business days to process
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-danger" style="flex: 1;">
                    Withdraw Funds
                </button>
                <a href="{{ url_for('wallet') }}" class="btn btn-secondary" style="flex: 1;">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
