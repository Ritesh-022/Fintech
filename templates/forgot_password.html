{% extends "base.html" %}

{% block title %}Forgot Password - FinTech Intelligence{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 0; max-width: 500px;">
    <div class="card" style="padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo" style="font-size: 2rem; margin-bottom: 0.5rem;">
                FinTech<span style="color: var(--secondary);">AI</span>
            </div>
            <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">Reset Password</h2>
            <p style="color: var(--text-secondary);">Enter your email to reset your password</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" 
                       name="email" 
                       class="form-control" 
                       placeholder="Enter your email"
                       required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Send Reset Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">
                Remember your password? 
                <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
