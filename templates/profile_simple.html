{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="container" style="padding: 3rem 0;">
    <h1>Profile</h1>
    
    <div class="card">
        <div class="card-body">
            <p><strong>Username:</strong> {{ user.username }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
