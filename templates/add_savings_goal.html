{% extends "base.html" %}

{% block title %}Add Savings Goal - FinTech Intelligence{% endblock %}

{% block content %}
<div class="container" style="padding: 3rem 0; max-width: 600px; margin: 0 auto;">
    <h1 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 3rem;">Create Savings Goal 🎯</h1>

    <div class="card">
        <div class="card-body">
            <form method="POST" class="form">
                <div class="form-group">
                    <label class="form-label">Goal Name</label>
                    <input type="text" name="goal_name" class="form-control" placeholder="e.g., Emergency Fund, Vacation, Car" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Target Amount (₹)</label>
                    <input type="number" name="target_amount" class="form-control" placeholder="10000" step="100" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Target Date</label>
                    <input type="date" name="deadline" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Goal</button>
                <a href="{{ url_for('savings') }}" class="btn btn-outline" style="width: 100%; margin-top: 0.5rem;">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
